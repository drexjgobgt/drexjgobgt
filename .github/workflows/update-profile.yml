name: Update Profile SVGs & README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Generate Solar Ember SVGs and sync README
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: drexjgobgt
        run: python scripts/generate_profile.py

      - name: Commit and push updated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg README.md
          if git diff --staged --quiet; then
            echo "No profile changes detected."
            exit 0
          fi
          git commit -m "chore: refresh live profile SVGs and telemetry"
          git push
